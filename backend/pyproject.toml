[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssta-backend"
version = "0.1.0"
description = "Scientific Skill Transfer Agent backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "boto3==1.35.90",
    "redis==5.2.1",
    "arq==0.26.3",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "langgraph==0.2.60",
    "langgraph-checkpoint-postgres==2.0.9",
    "pymupdf==1.25.1",
    "numpy==2.2.1",
    "nibabel==5.3.2",
    "pillow==11.1.0",
    "tifffile==2025.1.10",
    "pydicom==3.0.1",
    "scipy==1.15.0",
    "python-json-logger==3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
    "ruff==0.8.6",
    "anyio==4.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
