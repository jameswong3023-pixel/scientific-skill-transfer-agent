name: ssta

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ssta}:${POSTGRES_PASSWORD:-ssta_dev_password}@postgres:5432/${POSTGRES_DB:-ssta}
  SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-ssta}:${POSTGRES_PASSWORD:-ssta_dev_password}@postgres:5432/${POSTGRES_DB:-ssta}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-ssta}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-stealth/ox-alpha}
  SANDBOX_URL: http://sandbox:8000
  SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-600}
  AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ssta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssta}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core, edge]

  api:
    build:
      context: ./backend
    environment: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [core, edge, sandboxnet]

  worker:
    build:
      context: ./backend
    environment: *backend-env
    command: ["arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      api: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [core, sandboxnet]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  edge:
  core:
  sandboxnet:
    # No route to the internet. The sandbox service (Plan 02) attaches ONLY here,
    # which is what makes "agent code cannot phone home" a verifiable property
    # rather than a promise.
    internal: true
