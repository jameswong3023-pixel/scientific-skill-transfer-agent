name: ssta

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ssta}:${POSTGRES_PASSWORD:-ssta_dev_password}@postgres:5432/${POSTGRES_DB:-ssta}
  # +psycopg selects psycopg 3 (what this project pins); a bare postgresql://
  # URL resolves to psycopg2 and Alembic cannot import it.
  SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ssta}:${POSTGRES_PASSWORD:-ssta_dev_password}@postgres:5432/${POSTGRES_DB:-ssta}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-ssta}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-stealth/ox-alpha}
  SANDBOX_URL: http://sandbox:8000
  SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-600}
  AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ssta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssta}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core, edge]

  sandbox:
    build:
      context: ./sandbox
    # Deliberately NO environment anchor: this container must never see
    # OPENROUTER_API_KEY, database credentials, or S3 credentials.
    environment:
      SANDBOX_WORK_ROOT: /work
      SANDBOX_MAX_TIMEOUT_S: "900"
      SANDBOX_MEMORY_MB: "3072"
    user: "1000:1000"
    volumes:
      - sandboxwork:/work
    tmpfs:
      - /tmp:size=512m
    networks: [sandboxnet]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      # Host port is configurable because Windows/Hyper-V reserves scattered TCP
      # ranges (`netsh interface ipv4 show excludedportrange protocol=tcp`), and
      # 8000 commonly falls inside one. The container port never changes, so
      # service-to-service URLs are unaffected.
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      sandbox: {condition: service_healthy}
    networks: [core, edge, sandboxnet]

  worker:
    build:
      context: ./backend
    environment: *backend-env
    command: ["arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      api: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      sandbox: {condition: service_healthy}
    networks: [core, sandboxnet]

  # One-command demo: paper -> skill -> dataset -> A/B experiment.
  #
  #     docker compose run --rm seed --wait
  #
  # Behind a profile, so `docker compose up` never starts it. It reuses the
  # backend image because the script needs numpy/scipy/nibabel to generate the
  # phantom and httpx to drive the API, and those are already installed there --
  # which means a reviewer needs Docker and nothing else. The repository is bind
  # mounted rather than baked in: scripts/ and fixtures/ are developer tooling,
  # not part of the shipped application image, and the generated phantom has to
  # land back on the host so it can be re-uploaded without regenerating.
  seed:
    profiles: ["tools"]
    build:
      context: ./backend
    environment:
      SSTA_API: http://api:8000
      SSTA_UI: http://localhost:${FRONTEND_PORT:-3000}
    entrypoint: ["python", "/repo/scripts/seed_demo.py"]
    working_dir: /repo
    volumes:
      - .:/repo
    depends_on:
      api: {condition: service_started}
    networks: [core]

  frontend:
    build:
      context: ./frontend
    environment:
      # Server Components fetch over the compose network; the browser uses
      # same-origin relative paths so the SSE rewrite in next.config.ts holds.
      API_ORIGIN: http://api:8000
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_started}
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  miniodata:
  sandboxwork:

networks:
  edge:
  core:
  sandboxnet:
    # No route to the internet. The sandbox service (Plan 02) attaches ONLY here,
    # which is what makes "agent code cannot phone home" a verifiable property
    # rather than a promise.
    internal: true
